<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myntra OMS — Warehouse</title>
  <style>
    :root {
      --pink:#ff3f6c; --pink-dark:#e63462; --ink:#282c3f; --muted:#7e818c; --line:#eaeaec;
      --bg:#f5f5f6; --green:#03a685; --amber:#ff9f00; --red:#ff5b5b; --blue:#2b6cb0;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:10; }
    .brand { font-weight:800; font-size:20px; letter-spacing:.5px; }
    .brand span { color:var(--pink); }
    .brand small { display:block; font-weight:500; font-size:11px; color:var(--muted); letter-spacing:0; }
    header .spacer { flex:1; }
    .meta { font-size:13px; color:var(--muted); }
    .meta b { color:var(--ink); }
    .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:16px 24px; background:#fff; border-bottom:1px solid var(--line); }
    select, button, input[type=date] { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:9px 14px; border-radius:4px; cursor:pointer; }
    button.primary { background:var(--pink); color:#fff; border-color:var(--pink); font-weight:600; }
    button.primary:hover { background:var(--pink-dark); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .wrap { padding:20px 24px; }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
    th, td { text-align:left; padding:12px 14px; font-size:13px; border-bottom:1px solid var(--line); }
    th { background:#fafafa; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; font-size:11px; }
    tbody tr.order-row { cursor:pointer; }
    tbody tr.order-row:hover { background:#fff5f7; }
    td.mono, .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12px; color:var(--muted); }
    .pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.3px; }
    .pill.RFR { background:#e8f0ff; color:var(--blue); }
    .pill.WP, .pill.PK { background:#fff3e0; color:var(--amber); }
    .pill.SH, .pill.DL { background:#e6f7f2; color:var(--green); }
    .pill.IC { background:#ffecec; color:var(--red); }
    .pill.UNK { background:#eee; color:var(--muted); }
    .detail td { background:#fcfcfd; }
    .detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px 24px; margin-bottom:14px; }
    .detail-grid div { font-size:13px; }
    .detail-grid label { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:2px; }
    .lines { width:100%; border-collapse:collapse; margin-bottom:6px; }
    .lines th, .lines td { border-bottom:1px solid var(--line); font-size:12px; padding:8px 10px; }
    .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin:18px 0 4px; }
    .empty, .error { text-align:center; padding:40px; color:var(--muted); }
    .error { color:var(--red); }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; margin-right:5px; vertical-align:1px; }
    /* actions */
    .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0 14px; padding:12px; background:#fff; border:1px solid var(--line); border-radius:6px; }
    .actions .sect { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-right:4px; }
    .btn-sm { padding:6px 11px; font-size:12px; border-radius:4px; font-weight:600; }
    .btn-accept { background:#e6f7f2; color:var(--green); border-color:#bfe9df; }
    .btn-reject, .btn-cancel { background:#ffecec; color:var(--red); border-color:#ffd2d2; }
    .btn-ship, .btn-rtd { background:#e8f0ff; color:var(--blue); border-color:#cfe0fb; }
    .btn-doc { background:#fff; color:var(--ink); border-color:var(--line); text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
    .btn-doc:hover { background:#fafafa; }
    .sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
    /* toast */
    #toast-wrap { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
    .toast { background:#fff; border:1px solid var(--line); border-left:4px solid var(--muted); border-radius:6px; padding:11px 14px; font-size:13px; min-width:240px; max-width:380px; box-shadow:0 6px 22px rgba(0,0,0,.12); animation:slidein .2s ease; }
    .toast.ok { border-left-color:var(--green); }
    .toast.err { border-left-color:var(--red); }
    .toast b { display:block; margin-bottom:2px; }
    @keyframes slidein { from { transform:translateY(8px); opacity:0; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">MYNTRA <span>OMS</span><small>Warehouse · EXPERIENCES.DIGITAL</small></div>
    <div class="spacer"></div>
    <div class="meta" id="meta"><span class="live-dot"></span>Live from Myntra</div>
  </header>

  <div class="controls">
    <label class="meta" for="status">Status</label>
    <select id="status">
      <option value="">All statuses</option>
      <option value="RFR">New (Ready for Review)</option>
      <option value="WP">In Progress</option>
      <option value="PK">Packed</option>
      <option value="SH">Shipped</option>
      <option value="DL">Delivered</option>
      <option value="IC">Cancelled</option>
    </select>
    <label class="meta" for="from">From</label><input type="date" id="from" />
    <label class="meta" for="to">To</label><input type="date" id="to" />
    <span class="meta" title="Myntra caps date-filtered search to a 7-day range. Leave blank to see all orders.">ⓘ max 7-day range</span>
    <button class="primary" id="refresh">↻ Refresh</button>
    <label class="meta" style="margin-left:auto;"><input type="checkbox" id="auto" /> Auto-refresh 60s</label>
  </div>

  <div class="wrap">
    <div id="status-bar" class="meta" style="margin-bottom:10px;"></div>
    <table>
      <thead>
        <tr>
          <th style="width:160px;">Order ID</th>
          <th>Seller Order ID</th>
          <th style="width:90px;">Lines</th>
          <th style="width:200px;">Status</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
    <div class="pager">
      <button id="prev">← Prev</button>
      <span class="meta" id="pageinfo">Page 1</span>
      <button id="next">Next →</button>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script>
    const KEY = new URLSearchParams(location.search).get('key');
    const withKey = (url) => KEY ? url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(KEY) : url;
    const STATUS_LABEL = { RFR:'New', WP:'In Progress', PK:'Packed', SH:'Shipped', DL:'Delivered', IC:'Cancelled' };
    const labelFor = (c) => STATUS_LABEL[c] || (c || 'New');
    const classFor = (c) => (STATUS_LABEL[c] ? c : (c ? 'UNK' : 'RFR'));
    const $ = (id) => document.getElementById(id);

    let page = 0, totalPages = 1, lastData = null;
    const expanded = new Set();
    const detailCache = {};

    function toast(title, msg, kind) {
      const el = document.createElement('div');
      el.className = 'toast ' + (kind || '');
      el.innerHTML = '<b>' + title + '</b>' + (msg ? '<span>' + msg + '</span>' : '');
      $('toast-wrap').appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }
    const pill = (c) => '<span class="pill ' + classFor(c) + '">' + labelFor(c) + '</span>';
    const lineStatus = (l) => (l && l.status ? l.status : 'RFR');

    async function load() {
      const status = $('status').value;
      $('refresh').disabled = true;
      $('rows').innerHTML = '<tr><td colspan="4" class="empty"><span class="spin"></span>Fetching from Myntra…</td></tr>';
      $('status-bar').textContent = '';
      try {
        let url = '/orders/api/list?page=' + page;
        if (status) url += '&statusCode=' + encodeURIComponent(status);
        const from = $('from').value, to = $('to').value;
        if (from && to) {
          const days = (new Date(to) - new Date(from)) / 86400000;
          if (days < 0) { $('rows').innerHTML = '<tr><td colspan="4" class="error">“From” date must be before “To”.</td></tr>'; return; }
          if (days > 7) { $('rows').innerHTML = '<tr><td colspan="4" class="error">Myntra limits date-filtered search to a 7-day range. Narrow the dates, or clear both to see all orders.</td></tr>'; return; }
          url += '&startDate=' + from + '&endDate=' + to;
        } else if (from || to) {
          $('rows').innerHTML = '<tr><td colspan="4" class="error">Set both From and To dates, or clear both.</td></tr>'; return;
        }
        const res = await fetch(withKey(url));
        const data = await res.json();
        if (!data.ok) { $('rows').innerHTML = '<tr><td colspan="4" class="error">' + (data.statusMessage || data.error || 'Myntra returned an error') + '</td></tr>'; return; }
        lastData = data; render();
      } catch (e) {
        $('rows').innerHTML = '<tr><td colspan="4" class="error">Network error: ' + e.message + '</td></tr>';
      } finally { $('refresh').disabled = false; }
    }

    function render() {
      const data = lastData || {}, orders = data.orders || [];
      totalPages = data.pages || 1;
      $('status-bar').innerHTML = '<b>' + (data.totalCount ?? orders.length) + '</b> orders · updated ' + new Date().toLocaleString();
      $('pageinfo').textContent = 'Page ' + (page + 1) + ' of ' + totalPages;
      $('prev').disabled = page <= 0; $('next').disabled = page >= totalPages - 1;
      if (!orders.length) { $('rows').innerHTML = '<tr><td colspan="4" class="empty">No orders for this filter.</td></tr>'; return; }

      $('rows').innerHTML = orders.map((o) => {
        const lines = o.orderLines || [];
        const sellerId = lines[0] ? lines[0].sellerOrderId : '';
        let out = '<tr class="order-row" data-seller="' + sellerId + '">' +
          '<td><b>' + o.orderId + '</b></td>' +
          '<td class="mono">' + (sellerId || '—') + '</td>' +
          '<td>' + lines.length + '</td>' +
          '<td>' + pill(lineStatus(lines[0])) + '</td></tr>';
        if (expanded.has(sellerId)) {
          const cached = detailCache[sellerId];
          const inner = cached ? detailHtml(cached, sellerId)
            : '<span class="spin" style="border-color:#ccc;border-top-color:transparent"></span>Loading detail…';
          out += '<tr class="detail"><td colspan="4"><div>' + inner + '</div></td></tr>';
        }
        return out;
      }).join('');

      document.querySelectorAll('.order-row').forEach((tr) =>
        tr.addEventListener('click', () => toggleDetail(tr.dataset.seller)));
      expanded.forEach((sid) => { if (sid && !detailCache[sid]) loadDetail(sid); });
    }

    function toggleDetail(sellerId) {
      if (!sellerId) return;
      expanded.has(sellerId) ? expanded.delete(sellerId) : expanded.add(sellerId);
      render();
    }

    async function loadDetail(sellerId) {
      try {
        const res = await fetch(withKey('/orders/api/detail/' + encodeURIComponent(sellerId)));
        const data = await res.json();
        if (data.ok) detailCache[sellerId] = data.detail;
        if (expanded.has(sellerId)) render();
      } catch (e) { /* spinner stays; retry on next refresh */ }
    }

    const field = (l, v) => '<div><label>' + l + '</label>' + (v == null || v === '' ? '—' : v) + '</div>';

    function detailHtml(d, sellerId) {
      const lines = d.orderLineEntries || [];
      const addr = [d.address, d.locality, d.city, d.stateName || d.state, d.zipcode].filter(Boolean).join(', ');
      const l0 = lines[0] || {};
      const grid = '<div class="detail-grid">' +
        field('Customer', d.receiverName) + field('Mobile', d.mobile) +
        field('Payment', (d.paymentMethod || '').toUpperCase()) +
        field('Order Placed', l0.shipByTime) +
        field('Pack By', l0.packByTime) +
        field('Deliver By', l0.customerPromiseTime) +
        field('Address', addr) + '</div>';

      const rows = lines.map((l) => {
        const pkt = l.packetId || '';
        const docs = pkt
          ? '<a class="btn-sm btn-doc" target="_blank" href="' + withKey('/orders/api/label/' + encodeURIComponent(pkt)) + '">⤓ Label</a> ' +
            '<a class="btn-sm btn-doc" target="_blank" href="' + withKey('/orders/api/invoice/' + encodeURIComponent(pkt)) + '">⤓ Invoice</a>'
          : '<span class="mono">no packet yet</span>';
        return '<tr>' +
          '<td><b>' + (l.sku || '—') + '</b></td>' +
          '<td class="mono">' + (l.orderLineId || '') + '</td>' +
          '<td>₹' + (l.lineFinalAmount ?? l.mrp ?? '—') + '</td>' +
          '<td>' + pill(l.status_code) + '</td>' +
          '<td class="mono">' + (pkt || '—') + '</td>' +
          '<td>' + docs + '</td></tr>';
      }).join('');

      const sid = JSON.stringify(sellerId);
      const trackingNo = (lines.find((l) => l.trackingNumber) || {}).trackingNumber || '';
      // Drive the buttons off the order's current Myntra state. PPMP has no seller
      // "accept" (Myntra auto-accepts RFR -> WP), so that button is intentionally gone.
      const st = (lines[0] && lines[0].status_code) || 'RFR';
      const FLOW = {
        RFR: '🆕 New order — Myntra auto-accepts it to “In Progress”. No action needed yet; Ready to Dispatch unlocks once it reaches In Progress.',
        WP:  '⚙️ In Progress — click Ready to Dispatch to pack &amp; invoice it.',
        PK:  '📦 Packed — print the Label &amp; Invoice below, then click Ready to Ship with the tracking number.',
        SH:  '🚚 Shipped — fulfilment complete.',
        DL:  '✅ Delivered.',
        IC:  '⊘ Cancelled.',
      };
      const can = { rtd: st === 'WP', rts: st === 'PK', reject: st === 'RFR', cancel: st === 'RFR' || st === 'WP' };
      const btn = (cls, action, label, ok, extra) =>
        '<button class="btn-sm ' + cls + '"' +
        (ok ? '' : ' disabled title="Not available while order is ' + (STATUS_LABEL[st] || st) + '"') +
        ' onclick=\'act(' + sid + ',"' + action + '"' + (extra || '') + ')\'>' + label + '</button>';
      const actions = '<div class="actions">' +
        '<span class="sect" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);flex-basis:100%;margin-bottom:4px;">' + (FLOW[st] || ('Status: ' + (STATUS_LABEL[st] || st))) + '</span>' +
        btn('btn-rtd', 'ready_to_dispatch', '📦 Ready to Dispatch', can.rtd) +
        btn('btn-ship', 'ready_to_ship', '🚚 Ready to Ship', can.rts, ',' + JSON.stringify(trackingNo)) +
        btn('btn-reject', 'reject', '✕ Reject', can.reject) +
        btn('btn-cancel', 'cancel', '⊘ Cancel', can.cancel) +
        '</div>';

      return grid + actions +
        '<table class="lines"><thead><tr><th>SKU</th><th>Line ID</th><th>Amount</th><th>Status</th><th>Packet</th><th>Documents</th></tr></thead><tbody>' +
        rows + '</tbody></table>';
    }

    // Status-change handler — confirms (mutates the live Myntra account), then calls the API.
    async function act(sellerId, action, trackingNo) {
      const d = detailCache[sellerId] || {};
      const lines = d.orderLineEntries || [];
      const orderLineIds = lines.map((l) => l.orderLineId).filter(Boolean);
      const warehouse = d.warehouse || (lines[0] && lines[0].warehouse) || undefined;

      const labels = { accept:'ACCEPT', reject:'REJECT', cancel:'CANCEL', ready_to_ship:'mark READY TO SHIP', ready_to_dispatch:'mark READY TO DISPATCH' };
      let body = { action, orderLineIds, warehouse };
      if (action === 'cancel') { const r = prompt('Cancellation reason:', 'Out of stock'); if (r === null) return; body.comment = r; }
      if (action === 'ready_to_ship') {
        const tn = trackingNo || prompt('Tracking number to mark Ready to Ship:', '');
        if (!tn) return; body.trackingNo = tn;
      }
      if (action === 'ready_to_dispatch') {
        // Myntra's RTD requires invoiceNumber + invoiceDate per line (see myntradeveloper.md).
        // Reuse the order's own invoice when present; otherwise generate one (dd-MM-yyyy HH:mm:ss).
        const now = new Date();
        const p2 = (n) => String(n).padStart(2, '0');
        const invDate = p2(now.getDate()) + '-' + p2(now.getMonth() + 1) + '-' + now.getFullYear() +
          ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) + ':' + p2(now.getSeconds());
        body.orderLineEntries = lines.map((l) => ({
          sellerOrderId: sellerId,
          orderLineId: l.orderLineId,
          invoiceNumber: l.invoiceNumber || ('INV-' + l.orderLineId),
          invoiceDate: l.invoiceDate || invDate,
        }));
      }
      if (!confirm('This will ' + labels[action] + ' on the LIVE Myntra account for order ' + sellerId + '.\n\nProceed?')) return;

      toast('Sending…', labels[action] + ' · ' + sellerId);
      try {
        const res = await fetch(withKey('/orders/api/action/' + encodeURIComponent(sellerId)), {
          method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.ok) toast('Success', (data.message || labels[action] + ' done') + ' (code ' + (data.statusCode ?? res.status) + ')', 'ok');
        else toast('Myntra rejected it', (data.message || data.error || 'HTTP ' + res.status) + (data.statusCode ? ' (code ' + data.statusCode + ')' : ''), 'err');
        delete detailCache[sellerId];
        await loadDetail(sellerId); load();
      } catch (e) { toast('Network error', e.message, 'err'); }
    }
    window.act = act;

    $('refresh').addEventListener('click', () => load());
    $('status').addEventListener('change', () => { page = 0; load(); });
    $('from').addEventListener('change', () => { page = 0; load(); });
    $('to').addEventListener('change', () => { page = 0; load(); });
    $('prev').addEventListener('click', () => { if (page > 0) { page--; load(); } });
    $('next').addEventListener('click', () => { if (page < totalPages - 1) { page++; load(); } });
    let autoTimer = null;
    $('auto').addEventListener('change', (e) => { e.target.checked ? autoTimer = setInterval(load, 60000) : clearInterval(autoTimer); });

    // Start unfiltered: no status, no date window — shows ALL orders (like the live site).
    // Dates are optional; when used, Myntra caps the range to 7 days (enforced above).
    load();
  </script>
</body>
</html>
